<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ product.name }} Details</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/product_details.css') }}">
</head>
<body>
  <main>
    <article>
      {% if product.image %}
      <img class="product-image" src="{{ url_for('static', filename='uploads/' + product.image) }}" alt="{{ product.name }}">
      {% else %}
      <div class="product-placeholder">No Image</div>
      {% endif %}

      <h1>{{ product.name }}</h1>
      <p class="meta">{{ product.category }} - ${{ "%.2f"|format(product.price) }}</p>
      <p>{{ product.description }}</p>

      <div class="actions">
        <a class="button" href="{{ url_for('home') }}">Back to Products</a>
        <a class="button" href="{{ url_for('edit_product', product_id=product.id) }}">Edit</a>
        <form id="delete-form-{{ product.id }}" action="{{ url_for('delete_product') }}" method="post">
          <input type="hidden" name="product_id" value="{{ product.id }}">
          <button class="danger delete-trigger" type="button" data-form-id="delete-form-{{ product.id }}" data-product-name="{{ product.name|e }}">Delete Product</button>
        </form>
      </div>
    </article>
  </main>

  <div class="modal-backdrop" id="delete-modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
      <div class="modal-icon" aria-hidden="true">!</div>
      <h2 id="delete-modal-title">Delete product?</h2>
      <p id="delete-modal-message">Are you sure you want to delete this product? This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="cancel" type="button" id="cancel-delete">Cancel</button>
        <button class="danger" type="button" id="confirm-delete">Delete Product</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/product_details.js') }}"></script>
</body>
</html>
