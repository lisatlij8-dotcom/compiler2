<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit {{ product.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_product.css') }}">
</head>
<body>
  <main>
    <header>
      <h1>Edit Product</h1>
      <a class="button secondary" href="{{ url_for('product_details', product_id=product.id) }}">Back to Details</a>
    </header>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('edit_product', product_id=product.id) }}" method="post" enctype="multipart/form-data">
      {% if product.image %}
      <img class="image-preview" id="image-preview" src="{{ url_for('static', filename='uploads/' + product.image) }}" alt="{{ product.name }}">
      {% else %}
      <div class="image-placeholder" id="image-placeholder">No Image</div>
      <img class="image-preview" id="image-preview" alt="Selected product preview" style="display: none;">
      {% endif %}

      <label for="name">Name</label>
      <input id="name" type="text" name="name" value="{{ product.name }}" required>

      <label for="price">Price</label>
      <input id="price" type="number" step="0.01" min="0" name="price" value="{{ product.price }}" required>

      <label for="description">Description</label>
      <textarea id="description" name="description" required>{{ product.description }}</textarea>

      <label for="category">Category</label>
      <input id="category" type="text" name="category" value="{{ product.category }}" required>

      <label for="image">Replace Image</label>
      <input id="image" type="file" name="image" accept="image/*">

      <button type="submit">Save Changes</button>
    </form>
  </main>

  <script src="{{ url_for('static', filename='js/edit_product.js') }}"></script>
</body>
</html>
