<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product</title>
  <link rel="stylesheet" href="/static/css/add_product.css"></head><body>
  <main>
    <header>
      <h1>Add Product</h1>
      <a class="button secondary" href="/">Back to Products</a>
    </header>

    

    <form action="/add" method="post" enctype="multipart/form-data">
      <label for="name">Name</label>
      <input id="name" type="text" name="name" required>

      <label for="price">Price</label>
      <input id="price" type="number" step="0.01" min="0" name="price" required>

      <label for="description">Description</label>
      <textarea id="description" name="description" required></textarea>

      <label for="category">Category</label>
      <input id="category" type="text" name="category" required>

      <label for="image">Product Image</label>
      <input id="image" type="file" name="image" accept="image/*">
      <img class="image-preview" id="image-preview" alt="Selected product preview">
      <div class="image-tools" id="image-tools">
        <button class="secondary" type="button" id="change-image">Change Image</button>
        <button class="neutral" type="button" id="remove-image">Remove Image</button>
      </div>

      <button type="submit">Add Product</button>
    </form>
  </main>

  <script src="/static/js/add_product.js"></script></body></html>
